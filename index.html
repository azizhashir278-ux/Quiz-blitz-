

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>QUIVOX</title>

<style>
:root {
  --bg:#080d18;
  --panel:#14233a;
  --line:#304663;
  --lime:#c9ff35;
  --cyan:#43e7ff;
  --white:#f5f7ff;
  --muted:#9aaac2;
  --green:#4be0a1;
  --red:#ff6d86;
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at 50% -15%,#203653,#0b1423 48%,#070b13);
  color:var(--white);
  font-family:Arial,sans-serif;
}

button {
  cursor:pointer;
  font-family:inherit;
  touch-action:manipulation;
}

.app {
  max-width:560px;
  min-height:100vh;
  margin:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
}

.top {
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.audio {
  background:#172943;
  border:1px solid var(--line);
  color:white;
  border-radius:30px;
  padding:10px 13px;
  font-size:11px;
  font-weight:bold;
}

.brand {
  text-align:center;
  margin:18px 0 25px;
}

.logo {
  font-size:clamp(44px,12vw,64px);
  font-weight:1000;
  letter-spacing:5px;
  color:var(--lime);
  text-shadow:0 0 25px #c9ff3550;
}

.tag {
  font-size:11px;
  letter-spacing:3px;
  color:#a9b9d0;
  margin-top:7px;
}

.screen {
  display:none;
  flex:1;
  flex-direction:column;
}

.screen.active {
  display:flex;
}

h2 {
  text-align:center;
  font-size:24px;
  margin:8px 0;
}

.sub {
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin:5px 0 22px;
}

.cards {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.pick {
  min-height:112px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(145deg,#172943,#101b2e);
  color:white;
  font-size:18px;
  font-weight:850;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.emoji {
  font-size:30px;
}

.pick.selected,
.difficulty.selected {
  border:2px solid var(--lime);
  background:#1d3044;
  box-shadow:0 0 14px #c9ff3530;
}

.bottom {
  margin-top:auto;
  padding-top:22px;
}

.action {
  width:100%;
  min-height:54px;
  border:0;
  border-radius:15px;
  background:var(--lime);
  color:#111827;
  font-size:16px;
  font-weight:950;
}

.action:disabled {
  opacity:.4;
  cursor:not-allowed;
}

.back {
  background:transparent;
  color:#b8c8de;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px 18px;
  font-weight:bold;
}

.difficulties {
  display:grid;
  gap:12px;
}

.difficulty {
  min-height:67px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#14233a;
  color:white;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:16px;
  font-weight:850;
  text-align:left;
}

.difficulty small {
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
  font-weight:normal;
}

.dot {
  height:11px;
  width:11px;
  border-radius:50%;
  background:var(--lime);
  flex-shrink:0;
}

.panel {
  background:linear-gradient(150deg,#15243a,#101a2b);
  border:1px solid var(--line);
  border-radius:22px;
  padding:15px;
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat {
  background:#0a1423;
  border:1px solid #263b57;
  border-radius:12px;
  text-align:center;
  padding:9px 3px;
}

.stat strong {
  display:block;
  color:var(--lime);
  font-size:23px;
}

.stat span {
  font-size:10px;
  color:var(--muted);
}

.meta {
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:11px;
  margin-top:14px;
}

.track {
  height:6px;
  background:#293b55;
  border-radius:20px;
  margin-top:9px;
  overflow:hidden;
}

.fill {
  height:100%;
  background:linear-gradient(90deg,var(--lime),var(--cyan));
  width:0;
}

.question {
  font-size:22px;
  line-height:1.35;
  font-weight:bold;
  margin:23px 0 18px;
}

.answers {
  display:grid;
  gap:9px;
}

.answer {
  min-height:52px;
  text-align:left;
  padding:12px;
  border-radius:13px;
  background:#1a2a42;
  border:1px solid #3a5272;
  color:white;
  font-size:15px;
  font-weight:bold;
}

.answer:disabled {
  opacity:1;
}

.answer.correct {
  background:#174638;
  border-color:var(--green);
}

.answer.wrong {
  background:#51283a;
  border-color:var(--red);
}

.feedback {
  min-height:28px;
  color:var(--cyan);
  font-size:13px;
  font-weight:bold;
  margin-top:12px;
}

.nextrow {
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
}

.nextrow .action {
  width:auto;
  min-width:105px;
  min-height:46px;
  padding:0 15px;
}

.result {
  text-align:center;
  padding:24px 16px;
}

.score {
  font-size:58px;
  font-weight:1000;
  color:var(--lime);
  margin:15px;
}

.result p {
  color:var(--muted);
  line-height:1.5;
}

@media(max-width:370px) {
  .app {padding:12px}
  .pick {min-height:100px;font-size:16px}
  .brand {margin:14px 0 20px}
  .question {font-size:20px}
}
</style>
</head>

<body>
<main class="app">

<div class="top">
  <button class="audio" id="sfx">SFX ON</button>
  <button class="audio" id="music">MUSIC OFF</button>
</div>

<header class="brand">
  <div class="logo">QUIVOX</div>
  <div class="tag">THINK FAST. PLAY SMART.</div>
</header>

<!-- CATEGORY SCREEN -->
<section class="screen active" id="categoryScreen">
  <h2>Choose your category</h2>
  <p class="sub">Pick a challenge to get started</p>

  <div class="cards">
    <button class="pick" data-cat="Maths">
      <span class="emoji">🧮</span>Maths
    </button>
    <button class="pick" data-cat="Science">
      <span class="emoji">🔬</span>Science
    </button>
    <button class="pick" data-cat="GK">
      <span class="emoji">🌍</span>GK
    </button>
    <button class="pick" data-cat="Riddles">
      <span class="emoji">🧩</span>Riddles
    </button>
  </div>

  <div class="bottom">
    <button class="action" id="continue" disabled>CONTINUE</button>
  </div>
</section>

<!-- DIFFICULTY SCREEN -->
<section class="screen" id="difficultyScreen">
  <h2>Choose difficulty</h2>
  <p class="sub" id="chosenCategory">Selected category</p>

  <div class="difficulties">
    <button class="difficulty" data-level="Easy">
      <span>🟢 EASY<small>Warm up</small></span>
      <span class="dot"></span>
    </button>

    <button class="difficulty" data-level="Medium">
      <span>🔵 MEDIUM<small>Think it through</small></span>
      <span class="dot"></span>
    </button>

    <button class="difficulty" data-level="Hard">
      <span>🟠 HARD<small>Challenge yourself</small></span>
      <span class="dot"></span>
    </button>

    <button class="difficulty" data-level="Impossible">
      <span>🟣 IMPOSSIBLE<small>Tricky, but solvable</small></span>
      <span class="dot"></span>
    </button>
  </div>

  <div class="bottom" style="display:flex;gap:10px">
    <button class="back" id="back">BACK</button>
    <button class="action" id="start" disabled>START GAME</button>
  </div>
</section>

<!-- GAME SCREEN -->
<section class="screen" id="gameScreen">
  <div class="panel">
    <div class="stats">
      <div class="stat">
        <strong id="score">0</strong>
        <span>SCORE</span>
      </div>
      <div class="stat">
        <strong id="lives">3</strong>
        <span>LIVES</span>
      </div>
      <div class="stat">
        <strong id="timer">30</strong>
        <span>SECONDS</span>
      </div>
    </div>

    <div class="meta">
      <span id="number">QUESTION 1 / 20</span>
      <span id="streak">STREAK: 0</span>
    </div>

    <div class="track">
      <div class="fill" id="progress"></div>
    </div>

    <div class="meta">
      <span id="gameLabel"></span>
      <span id="bankCount"></span>
    </div>

    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>

    <div class="nextrow">
      <span style="flex:1;color:var(--muted);font-size:10px">
        15 correct in a row = +1 life
      </span>
      <button class="action" id="next" style="display:none">NEXT</button>
    </div>
  </div>
</section>

<!-- RESULTS SCREEN -->
<section class="screen" id="resultScreen">
  <div class="panel result">
    <h2 id="resultTitle">ROUND COMPLETE</h2>
    <div class="score" id="finalScore">0/20</div>
    <p id="resultInfo"></p>
    <button class="action" id="again">PLAY AGAIN</button>
    <button class="back" id="menu" style="width:100%;margin-top:12px">
      MAIN MENU
    </button>
  </div>
</section>

</main>

<script>
"use strict";

/* BASIC HELPERS */
function $(id) {
  return document.getElementById(id);
}

var screens = [
  "categoryScreen",
  "difficultyScreen",
  "gameScreen",
  "resultScreen"
];

function showScreen(id) {
  screens.forEach(function(screen) {
    $(screen).classList.toggle("active",screen === id);
  });
}

/* GAME VARIABLES */
var category = "";
var level = "";
var round = [];
var index = 0;
var score = 0;
var lives = 3;
var streak = 0;
var timeLeft = 30;
var clock = null;
var answered = false;
var bonusUsed = false;

var settings = {
  Easy: {time:30,lives:3},
  Medium: {time:20,lives:2},
  Hard: {time:15,lives:1},
  Impossible: {time:10,lives:1}
};

/* AUDIO */
var sfxOn = true;
var musicOn = false;
var audioCtx = null;
var musicTimer = null;
var musicStep = 0;

function unlockAudio() {
  try {
    if (!audioCtx) {
      var AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) return;

      audioCtx = new AudioContextClass();
    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  } catch(e) {}
}

function beep(freq,duration,volume,wave,force) {
  if (!sfxOn && !force) return;

  unlockAudio();
  if (!audioCtx) return;

  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();

    osc.type = wave || "sine";
    osc.frequency.setValueAtTime(freq || 650,audioCtx.currentTime);

    gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      volume || .04,audioCtx.currentTime + .012
    );
    gain.gain.exponentialRampToValueAtTime(
      .0001,audioCtx.currentTime + (duration || .1)
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + (duration || .1) + .02);
  } catch(e) {}
}

function startMusic() {
  if (musicTimer) return;

  unlockAudio();
  musicOn = true;
  $("music").textContent = "MUSIC ON";

  var notes = [
    392,494,587,494,
    440,523,659,523,
    392,494,587,784,
    659,587,494,440
  ];

  musicTimer = setInterval(function() {
    beep(notes[musicStep % notes.length],.22,.014,"triangle",true);
    musicStep++;
  },360);
}

function stopMusic() {
  musicOn = false;
  clearInterval(musicTimer);
  musicTimer = null;
  $("music").textContent = "MUSIC OFF";
}

$("sfx").addEventListener("click",function() {
  unlockAudio();
  sfxOn = !sfxOn;
  $("sfx").textContent = "SFX " + (sfxOn ? "ON" : "OFF");
  if (sfxOn) beep(880,.12,.05);
});

$("music").addEventListener("click",function() {
  unlockAudio();
  if (musicOn) stopMusic();
  else startMusic();
});

/* QUESTION HELPERS */
function shuffle(array) {
  var a = array.slice();

  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = a[i];
    a[i] = a[j];
    a[j] = temp;
  }

  return a;
}

function makeQuestion(text,correct,wrong) {
  return {
    text:text,
    correct:String(correct),
    options:shuffle([String(correct)].concat(wrong.map(String)))
  };
}

/* SCIENCE QUESTIONS */
var science = [
  ["Which gas do plants absorb during photosynthesis?","Carbon dioxide",["Oxygen","Nitrogen","Hydrogen"]],
  ["Which planet is called the Red Planet?","Mars",["Venus","Jupiter","Mercury"]],
  ["What is the chemical symbol for gold?","Au",["Ag","Gd","Go"]],

  ["Which instrument measures temperature?","Thermometer",["Barometer","Ammeter","Compass"]],
  ["What is the main gas in Earth's atmosphere?","Nitrogen",["Oxygen","Carbon dioxide","Argon"]],
  ["Which part of the eye controls light entering it?","Iris",["Retina","Lens","Cornea"]]

/* GENERAL KNOWLEDGE QUESTIONS */
var gk = [
  ["What is the capital of Japan?","Tokyo",["Kyoto","Osaka","Seoul"]],
  ["Which is the largest ocean?","Pacific Ocean",["Atlantic Ocean","Indian Ocean","Arctic Ocean"]],
  ["What is the capital of Pakistan?","Islamabad",["Karachi","Lahore","Peshawar"]],
  ["Which country is home to the Eiffel Tower?","France",["Italy","Spain","Germany"]],
  ["Which is the largest continent?","Asia",["Africa","Europe","North America"]],

  ["Which country gifted the Statue of Liberty to the USA?","France",["Canada","Spain","Germany"]],

  ["Which athlete is famous for sprinting?","Usain Bolt",["Roger Federer","Lionel Messi","Michael Phelps"]],

/* RIDDLE QUESTIONS */
var riddles = [
  ["What has keys but cannot open locks?","A piano",["A map","A clock","A door"]],
  ["What gets wetter the more it dries?","A towel",["A sponge","A cloud","A river"]],
  ["What has a face and two hands but no arms or legs?","A clock",["A statue","A robot","A book"]],
  ["What has to be broken before you can use it?","An egg",["A glass","A rule","A pencil"]],
  ["What goes up but never comes down?","Your age",["A balloon","Smoke","A lift"]],
  ["What has one eye but cannot see?","A needle",["A storm","A potato","A camera"]],
  ["What has many teeth but cannot bite?","A comb",["A shark","A zipper","A saw"]],
  ["What travels around the world while staying in one corner?","A postage stamp",["A compass","A plane","A shadow"]],
  ["What has a neck but no head?","A bottle",["A shirt","A guitar","A tree"]],
  ["What belongs to you but other people use it more?","Your name",["Your phone","Your shoes","Your house"]],
  ["What has words but never speaks?","A book",["A radio","A parrot","A teacher"]],
  ["What has cities but no houses, forests but no trees?","A map",["A dream","A globe","A painting"]],
  ["What can you catch but not throw?","A cold",["A ball","A shadow","A fish"]],
  ["What runs but never walks?","A river",["A dog","A clock","A person"]],
  ["What has four legs but cannot walk?","A table",["A horse","A chair","A cat"]],
  ["What is full of holes but still holds water?","A sponge",["A net","A basket","A sieve"]],
  ["What can fill a room but takes no space?","Light",["Air","Sound","Heat"]],
  ["What has 13 hearts but no other organs?","A deck of cards",["A calendar","A hospital","A flower"]],
  ["What kind of room has no doors or windows?","A mushroom",["A classroom","A bedroom","A showroom"]],
  ["What has branches but no leaves or fruit?","A bank",["A tree","A river","A family"]]
];

/* MATHS QUESTION GENERATOR */
function mathQuestion(d,n) {
  var a,b,c,ans,text;

  if (d === "Easy") {
    a = 3 + (n * 7) % 37;
    b = 2 + (n * 11) % 29;

    switch(n % 4) {
      case 0:
        ans = a + b;
        text = "What is " + a + " + " + b + "?";
        break;

      case 1:
        if (a < b) {
          var temp = a;
          a = b;
          b = temp;
        }
        ans = a - b;
        text = "What is " + a + " − " + b + "?";
        break;

      case 2:
        a = 2 + n % 12;
        b = 2 + (n * 3) % 10;
        ans = a * b;
        text = "What is " + a + " × " + b + "?";
        break;

      default:
        a = 2 + n % 9;
        b = 2 + (n * 5) % 9;
        ans = b;
        text = "What is " + (a*b) + " ÷ " + a + "?";
    }
  }

  else if (d === "Medium") {
    a = 3 + (n * 5) % 20;
    b = 2 + (n * 7) % 15;
    c = 2 + (n * 3) % 9;

    if (n % 2) {
      ans = a + b * c;
      text = "Solve: " + a + " + " + b + " × " + c + ".";
    } else {
      ans = (a + b) * c;
      text = "Solve: (" + a + " + " + b + ") × " + c + ".";
    }
  }

  else if (d === "Hard") {
    a = 3 + n % 17;
    b = 2 + (n * 3) % 13;
    c = 2 + (n * 7) % 9;

    if (n % 2) {
      ans = c;
      text = "If " + a + "x + " + b + " = " + (a*c+b) + ", what is x?";
    } else {
      ans = a + 4*b;
      text = "Find the next number: " + a + ", " +
        (a+b) + ", " + (a+2*b) + ", " + (a+3*b) + ", ___";
    }
  }

  else {
    a = 2 + n % 9;
    b = 3 + (n * 5) % 11;

    if (n % 2) {
      ans = a;
      text = "A number is doubled, then " + b +
        " is added. The result is " + (2*a+b) +
        ". What was the number?";
    } else {
      ans = a*10+b;
      text = "A two-digit number has tens digit " + a +
        " and ones digit " + b + ". What is it?";
    }
  }

  return makeQuestion(
    text,
    ans,
    [Number(ans)+2,Number(ans)-3,Number(ans)+5]
  );
}

/* BUILD QUESTION BANKS */
function createBank(cat,difficulty) {
  var bank = [];
  var source;

  if (cat === "Science") source = science;
  if (cat === "GK") source = gk;
  if (cat === "Riddles") source = riddles;

  for (var i=0; i<20; i++) {
    if (cat === "Maths") {
      bank.push(mathQuestion(difficulty,i+1));
    } else {
      var item = source[i];
      bank.push(makeQuestion(item[0],item[1],item[2]));
    }
  }

  return bank;
}

var banks = {};

["Maths","Science","GK","Riddles"].forEach(function(cat) {
  banks[cat] = {};

  ["Easy","Medium","Hard","Impossible"].forEach(function(d) {
    banks[cat][d] = createBank(cat,d);
  });
});

/* TIMER */
function stopClock() {
  if (clock !== null) {
    clearInterval(clock);
    clock = null;
  }
}

function startClock() {
  stopClock();

  timeLeft = settings[level].time;
  $("timer").textContent
  
  clock = setInterval(function() {
    timeLeft--;
    $("timer").textContent = timeLeft;

    if (timeLeft <= 0) {
      stopClock();
      choose(-1);
    }
  },1000);
}

/* DISPLAY QUESTION */
function renderQuestion() {
  answered = false;
  stopClock();

  var q = round[index];

  $("number").textContent = "QUESTION " + (index+1) + " / 20";
  $("score").textContent = score;
  $("lives").textContent = lives;
  $("streak").textContent = "STREAK: " + streak;
  $("gameLabel").textContent = category + " / " + level;
  $("bankCount").textContent = "20 QUESTIONS";
  $("progress").style.width = (index/20*100) + "%";

  $("question").textContent = q.text;
  $("feedback").textContent = "";
  $("next").style.display = "none";

  var area = $("answers");
  area.innerHTML = "";

  q.options.forEach(function(option,i) {
    var button = document.createElement("button");
    button.className = "answer";
    button.textContent = option;

    button.addEventListener("click",function() {
      choose(i);
    });

    area.appendChild(button);
  });

  startClock();
}

/* CHECK ANSWER */
function choose(choice) {
  if (answered) return;

  answered = true;
  stopClock();

  var q = round[index];
  var buttons = $("answers").children;
  var correctIndex = q.options.indexOf(q.correct);

  for (var i=0; i<buttons.length; i++) {
    buttons[i].disabled = true;

    if (i === correctIndex) {
      buttons[i].classList.add("correct");
    }
  }

  if (choice === correctIndex) {
    score++;
    streak++;

    $("feedback").textContent = "CORRECT! +1 POINT";
    beep(850,.15,.05);

    if (streak >= 15 && !bonusUsed) {
      lives++;
      bonusUsed = true;
      $("feedback").textContent += " +1 BONUS LIFE!";
    }

  } else {
    lives--;
    streak = 0;

    if (choice >= 0) {
      buttons[choice].classList.add("wrong");
    }

    $("feedback").textContent =
      choice < 0 ? "TIME'S UP!" : "NOT QUITE!";

    beep(220,.2,.05,"sawtooth");
  }

  $("score").textContent = score;
  $("lives").textContent = lives;
  $("streak").textContent = "STREAK: " + streak;

  if (lives <= 0) {
    $("feedback").textContent += " NO LIVES LEFT!";
  }

  $("next").style.display = "block";
  $("next").textContent =
    index === 19 || lives <= 0 ? "RESULTS" : "NEXT";
}

/* MOVE TO NEXT QUESTION */
function advance() {
  if (lives <= 0 || index >= 19) {
    finish();
    return;
  }

  index++;
  renderQuestion();
}

/* START ROUND */
function begin() {
  round = shuffle(banks[category][level]).slice(0,20);

  index = 0;
  score = 0;
  streak = 0;
  lives = settings[level].lives;
  bonusUsed = false;

  showScreen("gameScreen");
  renderQuestion();
}

/* RESULTS */
function finish() {
  stopClock();

  $("resultTitle").textContent =
    lives <= 0 ? "GAME OVER" : "ROUND COMPLETE";

  $("finalScore").textContent = score + "/20";

  $("resultInfo").textContent =
    "Category: " + category +
    " | Difficulty: " + level +
    " | Lives remaining: " + lives;

  $("progress").style.width = "100%";

  showScreen("resultScreen");
}

/* CATEGORY BUTTONS */
document.querySelectorAll("[data-cat]").forEach(function(button) {
  button.addEventListener("click",function() {
    category = button.dataset.cat;

    document.querySelectorAll("[data-cat]").forEach(function(b) {
      b.classList.toggle("selected",b === button);
    });

    $("continue").disabled = false;
    beep(600,.08,.04);
  });
});

/* CONTINUE */
$("continue").addEventListener("click",function() {
  if (!category) return;

  $("chosenCategory").textContent = category;
  showScreen("difficultyScreen");
});

/* DIFFICULTY BUTTONS */
document.querySelectorAll("[data-level]").forEach(function(button) {
  button.addEventListener("click",function() {
    level = button.dataset.level;

    document.querySelectorAll("[data-level]").forEach(function(b) {
      b.classList.toggle("selected",b === button);
    });

    $("start").disabled = false;
    beep(650,.08,.04);
  });
});

/* NAVIGATION */
$("back").addEventListener("click",function() {
  showScreen("categoryScreen");
});

$("start").addEventListener("click",function() {
  if (!level || !category) return;
  begin();
});

$("next").addEventListener("click",function() {
  advance();
});

$("again").addEventListener("click",function() {
  begin();
});

$("menu").addEventListener("click",function() {
  stopClock();
  stopMusic();

  category = "";
  level = "";

  $("continue").disabled = true;
  $("start").disabled = true;

  document.querySelectorAll("[data-cat]").forEach(function(b) {
    b.classList.remove("selected");
  });

  document.querySelectorAll("[data-level]").forEach(function(b) {
    b.classList.remove("selected");
  });

  showScreen("categoryScreen");
});

/* INITIAL SCREEN */
showScreen("categoryScreen");
</script>
</body>
</html>
